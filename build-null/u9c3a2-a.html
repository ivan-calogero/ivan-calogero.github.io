<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>NULL Process A — Control</title>
    <link rel="stylesheet" href="../assets/css/build-null.css">
</head>
<body class="null-process-page" data-process="control">
    <p class="null-process-title">TX CONTROLLER / READY</p>
    <p class="null-status success" data-control-state>Usa i tasti o la tastiera.</p>
    <div class="null-keypad" aria-label="Tastiera direzionale">
        <button type="button" data-key="ArrowUp" aria-label="Su">↑</button>
        <button type="button" data-key="ArrowLeft" aria-label="Sinistra">←</button>
        <button type="button" data-key="ArrowDown" aria-label="Giù">↓</button>
        <button type="button" data-key="ArrowRight" aria-label="Destra">→</button>
    </div>
    <script src="../assets/js/null-split-control.js"></script>
</body>
</html>
